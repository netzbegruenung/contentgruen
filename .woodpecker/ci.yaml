# Was ein PR bestehen muss, wie scripts/check.sh --integration: Retired words, Ruff, Black,
# Python-Unit- und Integrationstests (Qdrant und PostgreSQL als Dienste), Frontend-Tests,
# Frontend-Build (production, Budgets) und BFF.
# Jeder Schritt ruft check.sh mit --schritt auf, die Befehle stehen also nur dort.
# Status ci/woodpecker/pr/ci ist Pflicht fuer main. Ist ein PR-Lauf rot, schreibt
# ci-bericht die roten Schritte in den PR (docs/CI.md).
# Images: dieselben wie in den Dockerfiles und docker-compose.dev.yml;
# scripts/tests/test_woodpecker_ci.py haelt beide Stellen gleich. Installations- und schwere
# Schritte laufen in den CI-Images (Dockerfile.ci, ci-image.yaml), die auf denselben Images
# aufbauen; passt ein Image nicht zum Checkout, installiert der Schritt wie ohne.
# Kein Pfadfilter hier: ein uebersprungener Workflow meldet keinen Status. Pfadfilter nur je
# Schritt und nur fuer pull_request (geaenderte Dateien des PRs gegen die Basis): ein Schritt
# faellt nur weg, wenn ALLE geaenderten Dateien in Bereichen liegen, die er nicht liest
# (path.exclude). Alles Unbekannte, .woodpecker/, scripts/check.sh und die Doku laufen voll;
# liefert Forgejo keine Dateiliste, laeuft alles (on_empty). Push auf main, Tag und manuell
# laufen immer voll. python-installieren und unit laufen immer: Unit-Tests und scripts/tests/
# lesen auch Frontend- und BFF-Dateien (docs/CI.md, "Path filters").
when:
  - event: pull_request
  - event: push
    branch: main
  - event: [tag, manual]

clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.10.1
    settings:
      # Ganze Historie und main dazu: retired-words prueft die Zeilen seit der Abzweigung.
      partial: false
      depth: 0
      fetch-target-branch: true

services:
  - name: qdrant
    image: qdrant/qdrant:v1.18.2
    # Ohne absoluten Pfad startet der Dienst nicht
    entrypoint: [/qdrant/qdrant]
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: gutgesagt_app

steps:
  # Braucht nur git und python3; beides hat das Node-Image
  - name: retired-words
    image: node:22@sha256:3218f0d1b9e4b63def322e9ae362d581fbeac1ef21b51fc502ef91386667ce92
    depends_on: []
    when:
      - event: pull_request
    commands:
      - export CHECK_BASE=origin/$${CI_COMMIT_TARGET_BRANCH}
      - sh scripts/ci-protokoll.sh retired-words bash scripts/check.sh --schritt retired-words

  # venv, und bringt das CI-Image (Dockerfile.ci) die Pakete zu genau dieser requirements.txt
  # schon mit, nur der Verweis darauf; sonst pip wie bisher (scripts/ci-installieren.sh).
  - name: python-installieren
    image: git.verdigado.com/netzbegruenung-images/gutgesagt-ci-python:latest
    # :latest wandert mit jedem Build (ci-image.yaml); ohne pull bliebe ein altes Image im Agent.
    pull: true
    depends_on: []
    commands:
      - sh scripts/ci-protokoll.sh python-installieren sh scripts/ci-installieren.sh python

  # Einmal fuer frontend und frontend-build: die Schritte teilen den Workspace, ein zweites
  # npm ci loeschte dem anderen Schritt node_modules unter den Fuessen weg. Passt das CI-Image
  # zu package.json und package-lock.json, nur ein Verweis auf dessen node_modules.
  - name: frontend-installieren
    image: git.verdigado.com/netzbegruenung-images/gutgesagt-ci-node:latest
    pull: true
    depends_on: []
    when:
      # Nicht, wenn sich nur Backend und Python-Skripte aendern; das Frontend liest nichts davon
      - event: pull_request
        path:
          exclude: &ohne_frontend
            - mvp/backend/**
            - mvp/scripts/**
            - scripts/**/*.py
      - event: [push, tag, manual]
    commands:
      - sh scripts/ci-protokoll.sh frontend-installieren sh scripts/ci-installieren.sh frontend

  - name: lint
    image: git.verdigado.com/netzbegruenung-images/gutgesagt-ci-python:latest
    pull: true
    depends_on: [python-installieren]
    when:
      # Nicht, wenn sich nur Frontend und BFF aendern; Ruff und Black lesen nur app/
      - event: pull_request
        path:
          exclude: &ohne_python
            - mvp/frontend/**
            - mvp/backend/BFF/**
            - mvp/backend/BFF.Tests/**
            - mvp/backend/GutGesagt.sln
      - event: [push, tag, manual]
    commands:
      - sh scripts/ci-protokoll.sh lint bash scripts/check.sh --schritt lint

  - name: bff
    image: mcr.microsoft.com/dotnet/sdk:9.0@sha256:840f3b62b9742dde4461a3c31e38ffd34d41d7d33afd39c378cfcfd5dcb82bd5
    depends_on: []
    when:
      # Nicht, wenn sich nur Frontend, Python-Dienst und Python-Skripte aendern
      - event: pull_request
        path:
          exclude:
            - mvp/frontend/**
            - mvp/backend/semantic-search-service/**
            - mvp/backend/postgres-app/**
            - mvp/scripts/**
            - scripts/**/*.py
      - event: [push, tag, manual]
    environment:
      CHECK_VOLL: "1"
      # Kein Docker im Runner: dotnet direkt im SDK-Image
      CHECK_OHNE_DOCKER: "1"
    commands:
      - sh scripts/ci-protokoll.sh bff bash scripts/check.sh --schritt bff

  # Die vier schweren Schritte laufen nacheinander, nie zwei zugleich: der Runner ist geteilt,
  # parallel liefen ihm am 13.11. Speicher und Pipelines aus (docs/CI.md, "Staggered steps").
  # Kuerzeste zuerst, damit schnelle Fehler frueh kommen: unit, frontend-build, frontend,
  # integration. Alle laufen auch, wenn der Lauf schon rot ist (status success/failure):
  # sonst fiele unit nach einem frueh roten leichten Schritt aus, und nach rotem unit
  # fehlten ci-bericht alle Ergebnisse dahinter.
  - name: unit
    image: git.verdigado.com/netzbegruenung-images/gutgesagt-ci-python:latest
    pull: true
    depends_on: [python-installieren]
    when:
      - status: [success, failure]
    environment:
      CHECK_VOLL: "1"
      # Lokal 4; zwei Worker brauchen in der CI weniger Speicher neben den anderen Pipelines
      CHECK_WORKER: "2"
    commands:
      # Image dieses Schritts gegen den Checkout (scripts/ci-installieren.sh)
      - sh scripts/ci-protokoll.sh unit sh scripts/ci-installieren.sh --nachpruefen python
      - sh scripts/ci-protokoll.sh unit bash scripts/check.sh --schritt unit

  # Braucht kein Chromium.
  - name: frontend-build
    image: git.verdigado.com/netzbegruenung-images/gutgesagt-ci-node:latest
    pull: true
    depends_on: [frontend-installieren, unit]
    when:
      - event: pull_request
        path:
          exclude: *ohne_frontend
        status: [success, failure]
      - event: [push, tag, manual]
        status: [success, failure]
    environment:
      CHECK_VOLL: "1"
      # Worker-Threads von @angular/build (Standard min(4, Kerne - 1)), docs/CI.md
      NG_BUILD_MAX_WORKERS: "2"
    commands:
      # Image dieses Schritts gegen den Checkout (scripts/ci-installieren.sh)
      - sh scripts/ci-protokoll.sh frontend-build sh scripts/ci-installieren.sh --nachpruefen frontend
      - sh scripts/ci-protokoll.sh frontend-build bash scripts/check.sh --schritt frontend-build

  - name: frontend
    image: git.verdigado.com/netzbegruenung-images/gutgesagt-ci-node:latest
    pull: true
    depends_on: [frontend-installieren, frontend-build]
    when:
      - event: pull_request
        path:
          exclude: *ohne_frontend
        status: [success, failure]
      - event: [push, tag, manual]
        status: [success, failure]
    environment:
      CHECK_VOLL: "1"
      CHROME_BIN: /usr/local/bin/chromium-ci
      # ng test --source-map=false: dieselben Tests, weniger Speicher im Webpack-Prozess
      CHECK_OHNE_SOURCEMAPS: "1"
    commands:
      # Image dieses Schritts gegen den Checkout (scripts/ci-installieren.sh)
      - sh scripts/ci-protokoll.sh frontend sh scripts/ci-installieren.sh --nachpruefen frontend
      - sh scripts/ci-protokoll.sh frontend sh scripts/ci-chromium.sh
      - sh scripts/ci-protokoll.sh frontend bash scripts/check.sh --schritt frontend

  - name: integration
    image: git.verdigado.com/netzbegruenung-images/gutgesagt-ci-python:latest
    pull: true
    # frontend optional: faellt es per Pfadfilter weg, wartet integration auf unit
    depends_on:
      - python-installieren
      - unit
      - name: frontend
        optional: true
    when:
      - event: pull_request
        path:
          exclude: *ohne_python
        status: [success, failure]
      - event: [push, tag, manual]
        status: [success, failure]
    environment:
      CHECK_VOLL: "1"
      INTEGRATION_STACK_PFLICHT: "1"
      QDRANT_URL: http://qdrant:6333
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg2://app_user:ci@postgres:5432/gutgesagt_app
    commands:
      # Image dieses Schritts gegen den Checkout (scripts/ci-installieren.sh)
      - sh scripts/ci-protokoll.sh integration sh scripts/ci-installieren.sh --nachpruefen python
      - sh scripts/ci-protokoll.sh integration python3 scripts/ci_dienste_warten.py qdrant:6333 postgres:5432
      - sh scripts/ci-protokoll.sh integration bash scripts/check.sh --schritt integration

  # Nur Standardbibliothek, damit der Bericht auch kommt, wenn python-installieren scheitert.
  # Fehlt das Secret oder ist es nicht fuer pull_request freigegeben, bricht Woodpecker
  # jeden PR-Lauf ab, bevor ein Schritt laeuft (docs/CI.md).
  - name: ci-bericht
    image: python:3.13-slim
    # je Schritt ein Eintrag, in Pipeline-Reihenfolge (auch in der Argumentliste unten);
    # optional, was der Pfadfilter weglassen kann: sonst verwirft Woodpecker die Pipeline
    depends_on:
      - retired-words
      - python-installieren
      - name: frontend-installieren
        optional: true
      - name: lint
        optional: true
      - name: bff
        optional: true
      - unit
      - name: frontend-build
        optional: true
      - name: frontend
        optional: true
      - name: integration
        optional: true
    when:
      - event: pull_request
        status: failure
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_ci_bericht_token
      # Konto, dem der Token gehoert: nur dessen Kommentare zaehlen als voriger Bericht.
      # Gehoert der Token einem anderen Konto, nur hier mitaendern (docs/CI.md).
      CI_BERICHT_KONTO: verdigado-bot
    commands:
      - >-
        python3 scripts/ci_bericht.py
        retired-words
        python-installieren
        frontend-installieren
        lint
        bff
        unit
        frontend-build
        frontend
        integration
