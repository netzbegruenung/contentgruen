# Schreibt nach jedem Push auf main die Uebersicht der Rechtstext-Ablage ins Wiki (Seite
# "Rechtstexte Übersicht", #503): lesbar ohne Python, eingecheckt wird sie nicht
# (docs/CI.md, "Wiki page of the legal-text files").
# Nur push auf main: Das Secret ist nur fuer push freigegeben, PR-Laeufe sehen es nicht.
# Eigener Workflow, damit ein Fehler hier den Status von ci nicht beruehrt. Kein
# Pfadfilter: Das Skript schreibt nur, wenn sich die Tabellen geaendert haben, und so frischt
# ein Neustart des letzten Push-Laufs die Seite immer auf.
when:
  - event: push
    branch: main

steps:
  # Nur Standardbibliothek, kein venv noetig
  - name: wiki-seite
    image: python:3.13-slim
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_wiki_token
    commands:
      - python3 scripts/rechtstexte_wiki.py
