[pytest]
# Define the paths to the test directories
# Only unit tests are run by CI - integration tests require running services
testpaths = tests/unit

# Ensure the Python path includes the directory where main.py is located
pythonpath = .

# Note: CI script uses explicit path (app/tests/unit/) which overrides this
# Integration tests location: tests/integration
# Integration tests require Qdrant (localhost:6333) and PostgreSQL
# Run manually from project root: pytest app/tests/integration/ -v

# Test output configuration with coverage
addopts = -v --tb=short --strict-markers --disable-warnings
# Coverage disabled temporarily - install pytest-cov to enable:
# addopts = -v --tb=short --strict-markers --disable-warnings --cov=. --cov-report=html --cov-report=term-missing --cov-report=xml
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    api: marks tests as API tests
    asyncio: marks tests as async tests

# Coverage configuration
[tool:pytest-cov]
omit =
    tests/*
    venv/*
    __pycache__/*
    .pytest_cache/*
    */migrations/*
    */venv/*
    manage.py
    conftest.py

# Minimum test coverage (set to 70% initially, increase gradually)
minversion = 6.0

# Parallel test execution (uncomment when ready for faster tests)
# addopts = -v --tb=short --strict-markers --disable-warnings -n auto

# To enable coverage reporting, install pytest-cov first:
# pip install pytest-cov
# Then uncomment the coverage line above or run with:
# pytest --cov=. --cov-report=html --cov-report=term-missing
