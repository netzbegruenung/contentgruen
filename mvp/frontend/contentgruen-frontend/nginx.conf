server {
    listen 80;
    server_name _;  # Wildcard to match any hostname

    # Serve the index.html file for all requests
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Der Service Worker darf nicht in die *.js-Regel unten fallen: mit
    # "expires 1y" haenge ein Geraet ein Jahr an der ausgelieferten Fassung.
    # Browser deckeln die Lebensdauer von Worker-Skripten zwar selbst, aber
    # darauf soll sich hier nichts verlassen muessen. Exaktes Praefix "=",
    # damit diese Regel die Regex-Regel schlaegt.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # nginx' mime.types kennt .webmanifest je nach Version nicht und liefert dann
    # application/octet-stream aus. Der Typ wird deshalb hier festgelegt.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Optional: Static file caching (improves performance)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
        add_header Pragma "public";
        add_header Vary "Accept-Encoding";
    }

    # Optional: Disable cache for index.html (ensure up-to-date content)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}
