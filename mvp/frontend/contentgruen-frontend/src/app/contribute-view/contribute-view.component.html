<section class="content-section einleitung">
    <p class="hinweis-box erstnutzer-satz">{{ erstnutzerSatz }}</p>
</section>

<!-- Die Kette in drei Abschnitten - Einwerfen, Weiterarbeiten im Fangkorb,
     Verfassen - auf Desktop und Handy gleich -->
<div class="typ-zeilen">
    <h3 class="typ-zwischenueberschrift">Einwerfen</h3>
    <button type="button" class="typ-zeile rahmen-kachel einwerfen-block" (click)="navigateToRawInput()">
        <span class="typ-icon" aria-hidden="true">{{ kettenIcons.einwerfen }}</span>
        <span class="typ-text">
            <span class="typ-titel">Einwerfen</span>
            <span class="typ-satz">{{ fangkorbKurz }}</span>
        </span>
        <mat-icon class="typ-pfeil" aria-hidden="true">arrow_forward</mat-icon>
    </button>

    <h3 class="typ-zwischenueberschrift">Weiterarbeiten</h3>
    <button type="button" class="typ-zeile rahmen-kachel fangkorb-block" (click)="navigateToRawInputList()">
        <span class="typ-icon" aria-hidden="true">{{ kettenIcons.fangkorb }}</span>
        <span class="typ-text">
            <span class="typ-titel">Fangkorb</span>
            <span class="typ-satz">Einwürfe destillieren oder Sätze ausformulieren.</span>
        </span>
        <mat-icon class="typ-pfeil" aria-hidden="true">arrow_forward</mat-icon>
    </button>

    <h3 class="typ-zwischenueberschrift" id="abschnitt-verfassen">Verfassen</h3>

    <nav class="typ-liste" aria-labelledby="abschnitt-verfassen">

    <button type="button" class="typ-zeile commentary-card" (click)="formularOeffnen('commentary')">
        <span class="typ-icon" aria-hidden="true">💬</span>
        <span class="typ-text">
            <span class="typ-titel">{{ typLabel('commentary') }}</span>
            <span class="typ-satz">Fertige, direkt verwendbare Kommentare für Diskussionen und Social Media.</span>
        </span>
        <mat-icon class="typ-pfeil" aria-hidden="true">arrow_forward</mat-icon>
    </button>

    <button type="button" class="typ-zeile generictext-card" (click)="formularOeffnen('generictext')">
        <span class="typ-icon" aria-hidden="true">📄</span>
        <span class="typ-text">
            <span class="typ-titel">{{ typLabel('generictext') }}</span>
            <span class="typ-satz">Fakten, Zahlen und Hintergrundinformationen zum Thema.</span>
        </span>
        <mat-icon class="typ-pfeil" aria-hidden="true">arrow_forward</mat-icon>
    </button>

    <button type="button" class="typ-zeile image-card" (click)="formularOeffnen('image')">
        <span class="typ-icon" aria-hidden="true">🖼️</span>
        <span class="typ-text">
            <span class="typ-titel">{{ typLabel('image') }}</span>
            <span class="typ-satz">Politisch relevante Bilder mit Bildunterschrift.</span>
        </span>
        <mat-icon class="typ-pfeil" aria-hidden="true">arrow_forward</mat-icon>
    </button>
    </nav>
</div>
