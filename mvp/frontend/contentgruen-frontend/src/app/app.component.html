<div id="app-container">
    <mat-sidenav-container class="sidenav-container">
        <mat-sidenav #sidenav mode="over" position="end" class="mobile-sidenav">
            <app-mobile-menu
                [userInfo]="userInfo"
                [selectedProfilePictureUrl]="selectedProfilePictureUrl"
                (closeMenu)="sidenav.close()"
                (home)="navigateToHome()"
                (contribute)="navigateToContributeView()"
                (contributions)="navigateToContributionsView()"
                (rawInput)="navigateToRawInputView()"
                (rawInputList)="navigateToRawInputListView()"
                (login)="login()"
                (loginToContribute)="loginWithReturnUrl('/contribute')"
                (logout)="logout()"
                (help)="openHelpDialog()">
            </app-mobile-menu>
        </mat-sidenav>

        <mat-sidenav-content>
            <main class="main mat-elevation-z8">
                <!-- Mobile Header - Only shown on mobile devices -->
                <app-mobile-header
                    *ngIf="isMobile || isTablet"
                    [userInfo]="userInfo"
                    [selectedProfilePictureUrl]="selectedProfilePictureUrl"
                    (openMenu)="toggleMobileMenu()"
                    (login)="login()"
                    (loginToContribute)="loginWithReturnUrl('/contribute')"
                    (logout)="logout()"
                    (contribute)="navigateToContributeView()"
                    (contributions)="navigateToContributionsView()">
                </app-mobile-header>

                <!-- Desktop Header - Hidden on mobile -->
                <div class="component-box" *ngIf="!isMobile && !isTablet">
                    <div class="header">
                <div class="left-header-box">
                    <h1 class="desktop-header-title">
                        <button mat-icon-button
                                *ngIf="showBackButton"
                                (click)="zurueck()"
                                class="mat-elevation-z1 back-button-header"
                                aria-label="Zurück">
                            <mat-icon>arrow_back</mat-icon>
                        </button>
                        <a *ngIf="!istStartseite; else nurTitel" class="titel-link" routerLink="/search">{{ pageTitle }}</a>
                        <ng-template #nurTitel>{{ pageTitle }}</ng-template>
                    </h1>
                </div>

                <div class="right-header-box">
                    <!-- User info - to the left of avatar without login link -->
                    <ng-container *ngIf="userInfo?.isAuthenticated; else notLoggedIn">
                        <span class="user-info-compact">
                            <span class="welcome-text">Hallo </span>
                            <span class="text-bold">{{ userInfo?.userName }}</span>
                        </span>
                    </ng-container>
                    <ng-template #notLoggedIn>
                        <span class="user-info-compact">
                            <span class="desktop-login-text">Nicht angemeldet</span>
                        </span>
                    </ng-template>

                    <!-- Avatar - now on the right side, leftmost element -->
                    <div class="avatar-container"
                        role="button"
                        tabindex="0"
                        [attr.aria-label]="userInfo?.isAuthenticated ? 'Profilbild ändern' : 'Anmelden'"
                        (click)="userInfo?.isAuthenticated ? regenerateProfilePicture() : login()"
                        (keydown.enter)="userInfo?.isAuthenticated ? regenerateProfilePicture() : login()"
                        (keydown.space)="userInfo?.isAuthenticated ? regenerateProfilePicture() : login()">
                        <img *ngIf="userInfo?.isAuthenticated"
                            [src]="selectedProfilePictureUrl"
                            alt="profile picture"
                            class="profile-avatar" />
                        <img *ngIf="!userInfo?.isAuthenticated"
                            src="/icons/Profile_avatar_placeholder_large.png"
                            alt="Nicht angemeldet"
                            class="profile-avatar anonymous-avatar-icon" />
                    </div>

                    <!-- Desktop buttons -->
                    <ng-container *ngIf="!isMobile && !isTablet">
                        <ng-container *ngIf="userInfo?.isAuthenticated">
                            <span class="header-link text-emphasis"
                            *ngIf="userInfo?.isAdmin"
                            role="button" tabindex="0" aria-label="Admin Dashboard"
                            (click)="navigateToAdminDashboard()"
                            (keydown.enter)="navigateToAdminDashboard()"
                            (keydown.space)="navigateToAdminDashboard()">📊 Admin</span>

                            <span class="header-link text-emphasis"
                            role="button" tabindex="0" aria-label="Abmelden"
                            (click)="logout()"
                            (keydown.enter)="logout()"
                            (keydown.space)="logout()">Abmelden</span>

                            <span class="header-link text-emphasis"
                            role="button" tabindex="0" aria-label="Fangkorb anzeigen"
                            (click)="navigateToRawInputListView()"
                            (keydown.enter)="navigateToRawInputListView()"
                            (keydown.space)="navigateToRawInputListView()">{{ kettenIcons.fangkorb }} Fangkorb</span>

                            <span class="header-link text-emphasis"
                            role="button" tabindex="0" aria-label="Meine Beiträge anzeigen"
                            (click)="navigateToContributionsView()"
                            (keydown.enter)="navigateToContributionsView()"
                            (keydown.space)="navigateToContributionsView()">Meine Beiträge</span>

                            <button mat-raised-button class="dark-green-button" (click)="navigateToContributeView()">
                                <mat-icon>edit</mat-icon> Beitragen
                            </button>
                        </ng-container>
                        <ng-container *ngIf="!userInfo?.isAuthenticated">
                            <button mat-raised-button class="dark-green-button" (click)="login()">
                                Anmelden
                            </button>
                        </ng-container>
                    </ng-container>

                    <!-- Always visible buttons - Hide help button on mobile since it's in burger menu -->
                    <!-- Schnell einwerfen: der Fangkorb lebt davon, immer einen Klick
                         entfernt zu sein - deshalb ein eigener Knopf statt eines Wegs
                         durch die Beitragsauswahl. -->
                    <button mat-icon-button
                        *ngIf="userInfo?.isAuthenticated"
                        (click)="navigateToRawInputView()"
                        class="mat-elevation-z1"
                        aria-label="Schnell einwerfen">
                        <span class="header-emoji" aria-hidden="true">{{ kettenIcons.einwerfen }}</span>
                    </button>

                    <button mat-icon-button (click)="openHelpDialog()" class="mat-elevation-z1 desktop-only-button"
                        aria-label="Hilfe öffnen">
                        <mat-icon>help_outline</mat-icon>
                    </button>

                    <!--
                        Kein Haus-Knopf mehr: Der Titel links fuehrt zur Startseite,
                        und zwei Wege mit demselben Ziel nebeneinander stiften nur
                        Verwirrung mit dem Pfeil daneben.

                        Hier standen ausserdem ein Beitragen- und ein Menue-Knopf mit
                        *ngIf="isMobile || isTablet" - innerhalb dieses Blocks, der
                        selbst nur bei !isMobile && !isTablet gerendert wird. Die
                        Breakpoints sind disjunkt, die Bedingung war also nie wahr.
                        Beide Knoepfe gibt es mobil im eigenen Kopf (app-mobile-header).
                    -->
                </div>
            </div>
        </div>

        <div class="main-content">
            <router-outlet></router-outlet>
        </div>

        <app-footer></app-footer>
    </main>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
