<div class="mobile-menu-content">
    <div class="mobile-menu-header">
        <div class="mobile-menu-user-header">
            <img *ngIf="userInfo?.isAuthenticated"
                [src]="selectedProfilePictureUrl"
                alt="profile picture"
                class="mobile-menu-avatar" />
            <img *ngIf="!userInfo?.isAuthenticated"
                src="/icons/Profile_avatar_placeholder_large.png"
                alt="Nicht angemeldet"
                class="mobile-menu-avatar anonymous-avatar" />
            <div class="mobile-menu-username">
                <span *ngIf="userInfo?.isAuthenticated">{{ userInfo?.userName }}</span>
                <span *ngIf="!userInfo?.isAuthenticated">Nicht<br>angemeldet</span>
            </div>
        </div>
        <button mat-icon-button (click)="close()" class="close-menu-button">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- Erster Eintrag, fuer An- und Abgemeldete gleich: der Weg nach Hause -->
    <button mat-button (click)="onHomeClick()" class="mobile-menu-item mobile-menu-start">
        <mat-icon>home</mat-icon>
        Startseite
    </button>

    <div class="mobile-menu-user-info" *ngIf="userInfo?.isAuthenticated; else notLoggedInMenu">
        <button mat-raised-button color="primary" (click)="onContributeClick()" class="mobile-menu-item mobile-menu-beitragen">
            <mat-icon>add</mat-icon>
            Beitragen
        </button>
        <!-- Unter Beitragen, wie die Abschnitte auf /contribute: dieselben Namen, dieselbe Reihenfolge -->
        <div class="mobile-menu-gruppe" role="group" aria-label="Beitragen">
            <button mat-button (click)="onRawInputClick()" class="mobile-menu-item mobile-menu-einwerfen">
                <span class="menu-emoji" aria-hidden="true">{{ kettenIcons.einwerfen }}</span>
                {{ einwerfenTitel }}
            </button>
            <button mat-button (click)="onRawInputListClick()" class="mobile-menu-item mobile-menu-fangkorb">
                <span class="menu-emoji" aria-hidden="true">{{ kettenIcons.fangkorb }}</span>
                Fangkorb
            </button>
            <button mat-button (click)="onContributionsClick()" class="mobile-menu-item mobile-menu-beitraege">
                <span class="menu-emoji" aria-hidden="true">{{ kettenIcons.meineBeitraege }}</span>
                Meine Beiträge
            </button>
        </div>
        <button mat-button (click)="onLogoutClick()" class="mobile-menu-item">
            <mat-icon>logout</mat-icon>
            Abmelden
        </button>
    </div>
    <ng-template #notLoggedInMenu>
        <div class="mobile-menu-user-info">
            <button mat-raised-button color="primary" (click)="onLoginClick()" class="mobile-menu-item">
                <mat-icon>login</mat-icon>
                Anmelden
            </button>
        </div>
    </ng-template>

    <!-- Footer section in mobile menu -->
    <mat-divider class="mobile-menu-divider"></mat-divider>

    <div class="mobile-menu-footer">
        <button mat-button (click)="onHelpClick()" class="mobile-menu-item">
            <mat-icon>help_outline</mat-icon>
            Hilfe
        </button>

        <!-- Rechtstexte: der Footer ist mobil schmal, hier sind sie einen Tipp entfernt. -->
        <a mat-button routerLink="/impressum" (click)="close()" class="mobile-menu-item legal-impressum">
            <mat-icon>info</mat-icon>
            Impressum
        </a>

        <a mat-button routerLink="/datenschutz" (click)="close()" class="mobile-menu-item legal-datenschutz">
            <mat-icon>privacy_tip</mat-icon>
            Datenschutz
        </a>

        <a mat-button routerLink="/nutzungsbedingungen" (click)="close()" class="mobile-menu-item legal-nutzungsbedingungen">
            <mat-icon>gavel</mat-icon>
            Nutzungsbedingungen
        </a>

        <div class="mobile-menu-about">
            <!-- Anbieter zuerst, wie im Impressum. -->
            <p>Ein Projekt von <a target="_blank" rel="noopener" href="https://netzbegruenung.de/" class="anbieter-link">Netzbegrünung e.V.</a>, entwickelt von <a routerLink="/about" (click)="close()" class="about-link">Sebastian Banach</a></p>
        </div>
    </div>
</div>
