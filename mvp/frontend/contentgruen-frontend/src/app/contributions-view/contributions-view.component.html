<div class="component-box">
    <div *ngIf="isLoading">
        <p>Lade eigene Beiträge …</p>
        <div class="loading-container">
            <mat-spinner class="mat-spinner-color"></mat-spinner>
        </div>
    </div>

    <div *ngIf="!isLoading">
        <p *ngIf="!karten.length" class="beitraege-leer">Du hast noch keine Beiträge.</p>

        <p *ngIf="karten.length" class="album-statistik">{{ statistik }}</p>

        <app-kartenliste *ngIf="karten.length"
                         variante="kompakt"
                         [daten]="karten"
                         (angetippt)="inSucheAnzeigen($event)">
        </app-kartenliste>

        <mat-paginator *ngIf="totalRecords > SEITENGROESSE" [length]="totalRecords" [pageSize]="pageSize" [pageSizeOptions]="[24, 48, 96]" [hidePageSize]="istMobil"
            (page)="onPageChange($event)">
        </mat-paginator>
    </div>

</div>
