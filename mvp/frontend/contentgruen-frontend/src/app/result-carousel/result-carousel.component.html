<div class="results-list-container">
    <button type="button"
            class="scroll-button left"
            [disabled]="isAtStart"
            aria-label="Vorherige Karte"
            matTooltip="Vorherige Karte"
            (click)="scrollLeft()">
        <mat-icon>chevron_left</mat-icon>
    </button>

    <div #resultContainer class="result-container">
        <div class="card-spacing-start"></div>

        <div class="result-item-wrapper" *ngFor="let karte of daten; trackBy: nachId">
            <app-beitragskarte [daten]="karte"></app-beitragskarte>
        </div>

        <div class="card-spacing-end"></div>
    </div>

    <button type="button"
            class="scroll-button right"
            [disabled]="isAtEnd"
            aria-label="Nächste Karte"
            matTooltip="Nächste Karte"
            (click)="scrollRight()">
        <mat-icon>chevron_right</mat-icon>
    </button>
</div>
