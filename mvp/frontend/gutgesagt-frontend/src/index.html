<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Nur den Ursprung als verweisende Seite: Die Adresse der Ergebnisseite traegt
       den Suchtext und stuende sonst in Zugriffsprotokollen (#275). -->
  <meta name="referrer" content="strict-origin">
  <title>Gut gesagt – Nie wieder sprachlos</title>
  <!-- Linkvorschau in Messengern (WhatsApp, Signal, Telegram): fuer alle Seiten gleich, weil
       die SPA ohne Server-Rendering ausliefert; Vorschau je Beitrag folgt serverseitig.
       og:description wartet auf die Textentscheidung E4 (Persona-Runde 2), bis dahin steht
       dort der Platzhalter TODO-E4. og:title gleicht <title>, das prueft
       scripts/tests/test_vorschau_tags.py. Das Bild steht als Pfad: Fuer eine absolute
       Adresse muesste die Domain je Umgebung beim Containerstart eingesetzt werden. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gut gesagt">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="Gut gesagt – Nie wieder sprachlos">
  <meta property="og:description" content="TODO-E4">
  <meta property="og:image" content="/marke/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bilder liefert nginx mit "expires 1y" aus: Ein geaendertes Logo braucht einen
       neuen Dateinamen, sonst sehen wiederkehrende Besucher ein Jahr lang das alte. -->
  <link rel="icon" type="image/svg+xml" href="marke/logo.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="marke/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="marke/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Hell oder dunkel (#588): eigene Wahl aus dem Umschalter, sonst die Geraeteeinstellung.
       color-scheme meldet beides, damit Erweiterungen wie Dark Reader das eigene dunkle
       Thema erkennen. Die Farbe der Browserleiste setzen Skript und FarbschemaService. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#008939">
  <!-- Farbschema vor dem ersten Bild setzen: data-theme am <html>, gleiche Logik und gleicher
       Schluessel wie FarbschemaService; ohne Speicher gilt das Geraet. -->
  <script>
    (function () {
      var schema = null;
      try {
        schema = localStorage.getItem('gutgesagt-farbschema');
      } catch (e) {}
      if (schema !== 'light' && schema !== 'dark') {
        schema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', schema);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', schema === 'dark' ? '#1e1f1e' : '#008939');
    })();
  </script>
  <!-- Grundflaechen dunkel, bis das Stylesheet da ist: Der Build inlined nur das kritische CSS,
       das zur Build-Zeit zum <html> ohne data-theme passt, und laedt den Rest nachtraeglich.
       Hier stehen nur Grund, Karten, Schrift und die Baender (Suche, Willkommen/Rundgang folgen
       --such-band); alles andere kommt mit dem Stylesheet, dessen Werte danach gelten (es steht
       danach). Werte wie im Block html[data-theme='dark'] in theme/custom-theme.scss; das prueft
       scripts/tests/test_farbschema_inline.py. -->
  <style>
    html[data-theme='dark'] {
      color-scheme: dark;
      --bg-main: #1e1f1e;
      --bg-card: #282a29;
      --bg-surface: #282a29;
      --text-primary: rgba(255, 255, 255, 0.87);
      --primary-main: #e0e0e0;
      --primary-dark: #ececec;
      --such-band: #2e3c19;
      background: var(--bg-main);
      color: var(--text-primary);
    }

    html[data-theme='dark'] body {
      background: var(--bg-main);
      color: var(--text-primary);
    }
  </style>
  <link rel="apple-touch-icon" href="marke/icon-192.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
