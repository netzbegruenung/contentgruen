<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Nur den Ursprung als verweisende Seite: Die Adresse der Ergebnisseite traegt
       den Suchtext und stuende sonst in Zugriffsprotokollen (#275). -->
  <meta name="referrer" content="strict-origin">
  <title>Gut gesagt – Nie wieder sprachlos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bilder liefert nginx mit "expires 1y" aus: Ein geaendertes Logo braucht einen
       neuen Dateinamen, sonst sehen wiederkehrende Besucher ein Jahr lang das alte. -->
  <link rel="icon" type="image/svg+xml" href="marke/logo.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="marke/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="marke/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Hell und dunkel nach Geraeteeinstellung (#588); Erweiterungen wie Dark Reader
       erkennen daran das eigene dunkle Thema. -->
  <meta name="color-scheme" content="light dark">
  <!-- Farbschema vor dem ersten Bild setzen, damit nichts aufblitzt: eigene Wahl aus dem
       Umschalter, sonst die Geraeteeinstellung. Gleiche Logik und gleicher Schluessel wie
       FarbschemaService; ohne Speicher gilt das Geraet. -->
  <script>
    (function () {
      var schema = null;
      try {
        schema = localStorage.getItem('gutgesagt-farbschema');
      } catch (e) {}
      if (schema !== 'light' && schema !== 'dark') {
        schema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', schema);
    })();
  </script>
  <meta name="theme-color" content="#008939" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="marke/icon-192.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
