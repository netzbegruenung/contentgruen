<div id="app-container">
    <mat-sidenav-container class="sidenav-container">
        <mat-sidenav #sidenav mode="over" position="end" class="mobile-sidenav">
            <app-mobile-menu
                [userInfo]="userInfo"
                [selectedProfilePictureUrl]="selectedProfilePictureUrl"
                (closeMenu)="sidenav.close()"
                (home)="navigateToHome()"
                (contribute)="navigateToContributeView()"
                (meineBeitraege)="navigateToMeineBeitraege()"
                (einwerfen)="navigateToEinwerfenView()"
                (fangkorb)="navigateToFangkorbView()"
                (login)="login()"
                (loginToContribute)="loginWithReturnUrl('/contribute')"
                (logout)="logout()"
                (help)="openHelpDialog()"
                (rundgang)="rundgangStarten($event)"
                (profilbild)="openProfilbildDialog()"
                (feedback)="openFeedbackDialog()">
            </app-mobile-menu>
        </mat-sidenav>

        <mat-sidenav-content>
            <main class="main mat-elevation-z8">
                <!-- Mobile Header - Only shown on mobile devices -->
                <app-mobile-header
                    *ngIf="isMobile || isTablet"
                    [userInfo]="userInfo"
                    [selectedProfilePictureUrl]="selectedProfilePictureUrl"
                    (openMenu)="toggleMobileMenu()"
                    (login)="login()"
                    (loginToContribute)="loginWithReturnUrl('/contribute')"
                    (logout)="logout()"
                    (contribute)="navigateToContributeView()">
                </app-mobile-header>

                <!-- Desktop Header - Hidden on mobile -->
                <div class="component-box" *ngIf="!isMobile && !isTablet">
                    <div class="header" [class.header--titel-lang]="titelLang">
                <div class="left-header-box">
                    <h1 class="desktop-header-title" [class.desktop-header-title--lang]="titelLang">
                        <button mat-icon-button
                                *ngIf="showBackButton"
                                (click)="zurueck()"
                                class="mat-elevation-z1 back-button-header"
                                aria-label="Zurück">
                            <mat-icon>arrow_back</mat-icon>
                        </button>
                        <!--
                            Kein Link: Das Logo davor ist Schmuck ohne eigenen Namen
                            (alt=""), der Text nennt die Seite, auf der man ist
                            ("Fangkorb"), nicht die Marke. Zur Startseite fuehrt der
                            Haus-Knopf rechts im Kopf.
                        -->
                        <img class="kopf-logo" src="marke/logo.svg" alt="" width="44" height="44">
                        {{ pageTitle }}
                    </h1>
                </div>

                <div class="right-header-box">
                    <!-- User info - to the left of avatar without login link -->
                    <ng-container *ngIf="userInfo?.isAuthenticated; else notLoggedIn">
                        <span class="user-info-compact">
                            <span class="welcome-text">Hallo </span>
                            <span class="text-bold">{{ userInfo?.userName }}</span>
                        </span>
                    </ng-container>
                    <ng-template #notLoggedIn>
                        <span class="user-info-compact">
                            <span class="desktop-login-text">Nicht angemeldet</span>
                        </span>
                    </ng-template>

                    <!--
                        Angemeldet oeffnet der Avatar ein kleines Profilmenue wie mobil
                        (Meine Beitraege, Abmelden); frueher wuerfelte ein Klick ein
                        neues Bild. Ohne Anmeldung ist er nur ein Bild: Der Weg zum
                        Anmelden ist der Knopf daneben, nicht ein zweiter ueber den
                        Avatar (#343).
                    -->
                    <button *ngIf="userInfo?.isAuthenticated; else avatarBesucher"
                        type="button"
                        class="avatar-container avatar-klickbar"
                        [matMenuTriggerFor]="profilmenue"
                        aria-label="Profilmenü öffnen">
                        <img [src]="selectedProfilePictureUrl"
                            alt="Profilbild"
                            class="profile-avatar" />
                    </button>
                    <ng-template #avatarBesucher>
                        <div class="avatar-container">
                            <img src="/icons/Profile_avatar_placeholder_large.png"
                                alt="Nicht angemeldet"
                                class="profile-avatar anonymous-avatar-icon" />
                        </div>
                    </ng-template>
                    <mat-menu #profilmenue="matMenu">
                        <button mat-menu-item type="button" class="profilmenue-eintrag"
                            (click)="navigateToMeineBeitraege()">
                            <span class="profilmenue-emoji mat-icon" aria-hidden="true">{{ kettenIcons.meineBeitraege }}</span>
                            <span>Meine Beiträge</span>
                        </button>
                        <button mat-menu-item type="button" class="profilmenue-eintrag" (click)="openProfilbildDialog()">
                            <mat-icon>face</mat-icon>
                            <span>Profilbild wählen</span>
                        </button>
                        <button mat-menu-item type="button" class="profilmenue-eintrag" (click)="logout()">
                            <mat-icon>logout</mat-icon>
                            <span>Abmelden</span>
                        </button>
                    </mat-menu>

                    <!--
                        Desktop-Kopf in einer Zeile mit zwei Stilen: Textlinks (Admin,
                        Hier fehlt eine Antwort) und runde Icon-Knoepfe a 44 px; dazu der
                        eine Primaerknopf. Abmelden steht nur im Profilmenue, Fangkorb und
                        Feedback sind Icon-Knoepfe mit Text fuer Screenreader (#512).
                    -->
                    <ng-container *ngIf="userInfo?.isAuthenticated">
                        <button mat-icon-button type="button"
                            (click)="navigateToFangkorbView()"
                            class="mat-elevation-z1"
                            matTooltip="Fangkorb"
                            data-testid="fangkorb-knopf">
                            <span class="header-emoji" aria-hidden="true">{{ kettenIcons.fangkorb }}</span>
                            <span class="cdk-visually-hidden">Fangkorb</span>
                        </button>

                        <!-- Unter 1200 px werden die Textlinks zu runden Icon-Knoepfen, der
                             Text bleibt fuer Screenreader (kopf-text). -->
                        <a class="header-link" *ngIf="userInfo?.isAdmin" routerLink="/admin/dashboard" matTooltip="Admin"
                           [matTooltipDisabled]="!kopfSchmal">
                            <mat-icon class="kopf-icon" aria-hidden="true">admin_panel_settings</mat-icon>
                            <span class="kopf-text">Admin</span>
                        </a>

                        <a class="header-link" [routerLink]="hierFehltEineAntwortPfad" matTooltip="Hier fehlt eine Antwort"
                           [matTooltipDisabled]="!kopfSchmal">
                            <mat-icon class="kopf-icon" aria-hidden="true">contact_support</mat-icon>
                            <span class="kopf-text">Hier fehlt eine Antwort</span>
                        </a>

                        <button mat-raised-button class="dark-green-button beitragen-knopf" (click)="navigateToContributeView()">
                            <mat-icon>add</mat-icon> <span class="beitragen-text">Beitragen</span>
                        </button>
                    </ng-container>
                    <ng-container *ngIf="!userInfo?.isAuthenticated">
                        <button mat-raised-button class="dark-green-button" (click)="login()">
                            Anmelden
                        </button>
                    </ng-container>

                    <!-- Schnell einwerfen: der Fangkorb lebt davon, immer einen Klick
                         entfernt zu sein - deshalb ein eigener Knopf statt eines Wegs
                         durch die Beitragsauswahl. -->
                    <button mat-icon-button
                        *ngIf="userInfo?.isAuthenticated"
                        (click)="navigateToEinwerfenView()"
                        class="mat-elevation-z1"
                        matTooltip="Schnell einwerfen"
                        aria-label="Schnell einwerfen">
                        <span class="header-emoji" aria-hidden="true">{{ kettenIcons.einwerfen }}</span>
                    </button>

                    <button mat-icon-button type="button" (click)="openFeedbackDialog()" class="mat-elevation-z1"
                        matTooltip="Feedback" data-testid="feedback-knopf">
                        <mat-icon aria-hidden="true">feedback</mat-icon>
                        <span class="cdk-visually-hidden">Feedback</span>
                    </button>

                    <button mat-icon-button (click)="openHelpDialog()" class="mat-elevation-z1 desktop-only-button hilfe-knopf"
                        aria-label="Hilfe öffnen">
                        <mat-icon>help_outline</mat-icon>
                    </button>

                    <!--
                        Hier standen ausserdem ein Beitragen- und ein Menue-Knopf mit
                        *ngIf="isMobile || isTablet" - innerhalb dieses Blocks, der
                        selbst nur bei !isMobile && !isTablet gerendert wird. Die
                        Breakpoints sind disjunkt, die Bedingung war also nie wahr.
                        Beide Knoepfe gibt es mobil im eigenen Kopf (app-mobile-header).
                    -->

                    <!--
                        Der Weg zur Startseite auf Desktop; mobil leistet das der
                        erste Menueeintrag, dort waere ein weiterer Knopf im engen
                        Kopf einer zu viel.

                        Ueber den NavigationService statt per routerLink: Die
                        Destillier-Ansicht soll auch hier erst ihren Satz speichern
                        duerfen, bevor die Seite verlassen wird.
                    -->
                    <button mat-icon-button (click)="zurStartseite()" class="mat-elevation-z1"
                        aria-label="Zur Startseite">
                        <mat-icon>home</mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <router-outlet></router-outlet>
        </div>

        <app-footer></app-footer>
    </main>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>

<!-- Rundgaenge (#389); die Schritte stehen in rundgang-daten.ts. Erst geladen, wenn einer
     laeuft: Die meisten Besuche brauchen ihn nie, das Start-Bundle bleibt schlank. -->
@defer (when rundgang.aktiv()) {
    <app-rundgang></app-rundgang>
}
