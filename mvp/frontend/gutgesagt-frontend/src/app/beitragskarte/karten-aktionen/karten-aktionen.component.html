<!--
    In der Vorschau: aria-disabled und tabIndex ueber die Inputs von MatButton setzen.
    Ein [attr.aria-disabled] am Knopf ueberschreibt MatButton mit seiner Host-Bindung.
-->
<div class="aktionen" [attr.aria-disabled]="vorschau || null">
    <!-- Einfarbige Umriss-Hand, damit sich die Knöpfe vom farbigen Siegel abheben (#416) -->
    <div class="stimmen" *ngIf="abstimmenSichtbar">
        <button mat-icon-button type="button" class="stimme-knopf"
                [class.active-button]="isLiked"
                [attr.aria-pressed]="isLiked"
                [aria-disabled]="vorschau"
                [tabIndex]="vorschau ? -1 : undefined"
                [attr.aria-label]="beschriftung('Hilfreich', zahlHilfreich)"
                matTooltip="Hilfreich" matTooltipPosition="above"
                (click)="toggleLike()">
            <svg class="stimm-hand" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path [attr.d]="HAND_UMRISS" fill="currentColor"/></svg>
        </button>
        <!-- Zaehler (#427): Summe der Stimmen anderer, erst ab der Mindestzahl; vorgelesen steht er im Namen des Knopfs -->
        <span class="stimm-zahl" *ngIf="zahlHilfreich !== null" aria-hidden="true">{{ zahlHilfreich }}</span>
        <button mat-icon-button type="button" class="stimme-knopf"
                [class.active-button]="isDisliked"
                [attr.aria-pressed]="isDisliked"
                [aria-disabled]="vorschau"
                [tabIndex]="vorschau ? -1 : undefined"
                [attr.aria-label]="beschriftung('Nicht hilfreich', zahlNichtHilfreich)"
                matTooltip="Nicht hilfreich" matTooltipPosition="above"
                (click)="toggleDislike()">
            <svg class="stimm-hand runter" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path [attr.d]="HAND_UMRISS" fill="currentColor"/></svg>
        </button>
        <span class="stimm-zahl" *ngIf="zahlNichtHilfreich !== null" aria-hidden="true">{{ zahlNichtHilfreich }}</span>
    </div>

    <!-- Ein Knopf ohne Pfeil daneben (#641): Was er kopiert, sagt der Tooltip (auch als Beschreibung vorgelesen); die andere Variante steht im ⋮-Menue -->
    <div class="kopieren">
        <button mat-raised-button type="button" class="gutgesagt-primary-dark kopieren-knopf"
                [class.copy-success]="copyAnimationActive"
                [aria-disabled]="vorschau"
                [tabIndex]="vorschau ? -1 : undefined"
                [matTooltip]="kopierHinweis" matTooltipPosition="above" matTooltipShowDelay="500"
                (click)="kopieren()">
            <mat-icon>content_copy</mat-icon>
            <span>{{ kopierBeschriftung }}</span>
        </button>
    </div>

    <button mat-icon-button type="button" class="menue-knopf"
            [matMenuTriggerFor]="menue"
            [aria-disabled]="vorschau"
            [tabIndex]="vorschau ? -1 : undefined"
            aria-label="Mehr Optionen"
            matTooltip="Mehr Optionen" matTooltipPosition="above">
        <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menue="matMenu">
        <button mat-menu-item type="button" class="zweite-kopie" *ngIf="zweiteKopie as zweite" (click)="zweiteKopieren()">
            <mat-icon>content_copy</mat-icon>
            <span>{{ zweite.wort }}</span>
        </button>
        <button mat-menu-item type="button" *ngIf="kannAlsVorlage" (click)="alsVorlageNehmen()">
            <mat-icon>call_split</mat-icon>
            <span>Als Vorlage nehmen</span>
        </button>
        <button mat-menu-item type="button" (click)="openReportDialog()">
            <mat-icon>flag</mat-icon>
            <span>Inhalt melden</span>
        </button>
        <!-- Die eigene Adresse des Beitrags (#300), etwa um ihn wiederzufinden -->
        <button mat-menu-item type="button" class="beitrag-oeffnen" *ngIf="ansichtVerlinkt && inhaltId && !vorschau"
                (click)="beitragOeffnen()">
            <mat-icon>article</mat-icon>
            <span>Beitrag öffnen</span>
        </button>
    </mat-menu>
</div>
