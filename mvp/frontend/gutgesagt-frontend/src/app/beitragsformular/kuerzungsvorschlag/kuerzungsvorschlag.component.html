<div *ngIf="lohntSich" class="kuerzungsvorschlag">
    <button *ngIf="stand !== 'vorschlag' && stand !== 'passt-nicht'" type="button" class="text-link" (click)="vorschlagen()"
            [disabled]="stand === 'laedt'">Kürzungsvorschlag</button>
    <div aria-live="polite">
        <div *ngIf="stand === 'vorschlag'" class="kuerzungsvorschlag-box">
            <p class="kuerzungsvorschlag-text">{{ vorschlag }}</p>
            <p class="kuerzungsvorschlag-fuss">Aus deinen eigenen Sätzen, ohne generative KI · {{ vorschlag.length }} Zeichen</p>
            <div class="kuerzungsvorschlag-aktionen">
                <button type="button" class="text-link" (click)="annehmen()">Übernehmen</button>
                <button type="button" class="text-link" (click)="verwerfen()">Verwerfen</button>
            </div>
        </div>
        <p *ngIf="stand === 'passt-nicht'" class="kuerzungsvorschlag-fuss">
            Kein Vorschlag passt in die Kurzfassung. Schreib sie lieber selbst.
        </p>
    </div>
    <p *ngIf="stand === 'fehler'" class="kuerzungsvorschlag-fuss" role="alert">
        Ein Vorschlag geht gerade nicht. Versuch es später noch einmal.
    </p>
</div>
