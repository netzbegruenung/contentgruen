<div class="dubletten-hinweis">
    <!-- &ngsp;: Angular streicht Leerraum zwischen Elementen, sonst klebt "Ansehen" am Titel -->
    <p role="status">
        {{ hinweis }}&ngsp;<span *ngIf="vorhanden.titel" class="vorhanden-titel">„{{ vorhanden.titel }}“</span>&ngsp;<button type="button" class="text-link dublette-ansehen" (click)="ansehen.emit()">Ansehen</button>
    </p>
    <!-- Die Person waehlt den vorhandenen (fremd: zustimmen, eigen: nehmen); trotzdem speichern ist der Hauptknopf des Formulars -->
    <div *ngIf="offeneEntscheidung && (kannZustimmen || kannNehmen)" class="dublette-entscheidung">
        <button *ngIf="kannZustimmen" mat-stroked-button type="button" class="dublette-zustimmen"
                [disabled]="beschaeftigt" (click)="zustimmen.emit()">Zustimmen</button>
        <button *ngIf="kannNehmen" mat-stroked-button type="button" class="dublette-nehmen"
                [disabled]="beschaeftigt || nehmenGesperrt" (click)="nehmen.emit()">
            <mat-spinner *ngIf="nimmt" diameter="18" class="knopf-spinner"></mat-spinner>
            {{ nehmenText }}
        </button>
    </div>
    <p *ngIf="fehler" class="entscheidungs-fehler" role="alert">{{ fehler }}</p>
</div>
