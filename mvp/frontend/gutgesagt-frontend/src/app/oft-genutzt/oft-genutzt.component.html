<section *ngIf="karten.length > 0" class="oft-genutzt" aria-labelledby="oft-genutzt-titel">
  <h2 id="oft-genutzt-titel">Diese Woche oft genutzt</h2>
  <!-- Mobil eine Liste, ab 600 px das Karussell -->
  <app-kartenliste *ngIf="istMobil; else karussell" [daten]="karten"></app-kartenliste>
  <ng-template #karussell>
    <app-result-carousel [daten]="karten"></app-result-carousel>
  </ng-template>
</section>
