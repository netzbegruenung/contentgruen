<div class="workflow-container">
    <div *ngIf="isLoadingStatement" class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Aussage wird geladen …</p>
    </div>

    <app-add-generictext
        *ngIf="!isLoadingStatement"
        (success)="onSuccess($event)"
        [statementText]="statementText"
        [statementId]="statementId"
        [aussageHinweis]="aussageHinweis"
        [vorbefuellung]="vorbefuellung">
    </app-add-generictext>
</div>
