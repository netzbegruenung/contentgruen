<section class="about-teaser-section">
  <h2>Die Geschichte hinter Gut gesagt</h2>
  <div class="about-teaser-content">
    <!-- Erst kurz erklaeren, dann der Knopf, darunter das Zitat mit Bild und Name (Designrunde 17.11.) -->
    <p class="teaser-text">
      In Kommentarspalten tauchen immer wieder dieselben Aussagen auf, und jede Person schreibt
      ihre Antwort von vorn. Gut gesagt sammelt deshalb gute Antworten, damit alle sie finden.
    </p>

    <div class="cta-container">
      <a mat-raised-button
         color="primary"
         routerLink="/about">
        <mat-icon>arrow_forward</mat-icon>
        Mehr über Gut gesagt erfahren
      </a>
    </div>

    <figure class="zitat">
      <blockquote>
        <p>Gut gesagt sammelt Antworten, die Unentschiedene mitnehmen: von vielen geschrieben,
          von vielen verbessert und frei für alle.</p>
      </blockquote>
      <figcaption class="profil">
        <img src="/profilbild-2026.jpg"
             alt=""
             class="profile-image"
             width="56" height="56">
        <span class="profile-info">
          <span class="profil-name">Sebastian Banach</span>
          <span class="role">Entwickler & Gründer</span>
        </span>
      </figcaption>
    </figure>
  </div>
</section>
