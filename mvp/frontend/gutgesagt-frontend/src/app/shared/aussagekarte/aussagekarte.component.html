<article class="aussagekarte">
    <header class="aussagekarte-kopf">
        <mat-icon class="aussagekarte-icon" aria-hidden="true">format_quote</mat-icon>
        <div class="aussagekarte-kopftext">
            <span class="aussagekarte-art">Aussage ohne Antwort</span>
            <p class="aussagekarte-titel" [ngClass]="titelKlasse" [id]="titelId">{{ text }}</p>
        </div>
    </header>
    <div class="aussagekarte-inhalt">
        <p *ngIf="gesucht" class="gesucht">{{ gesucht }}</p>
        <ng-content></ng-content>
    </div>
    <footer class="aussagekarte-fuss">
        <a mat-raised-button class="dark-green-button antworten"
           [routerLink]="antwortenPfad"
           [queryParams]="antwortenParams"
           [attr.aria-describedby]="titelId">Antworten</a>
    </footer>
</article>
