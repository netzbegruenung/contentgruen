<!--
    Sichtfeld 3.5 -1 57.5 64.5: eng um Blase und Hand in jedem Winkel (rechts reicht die
    waagrechte Hand bis 60.6, oben der senkrechte Daumen bis -0.6, unten die Spitze der
    Blase bis 63). Der Glanz-Stern ragt oben links darüber hinaus (overflow: visible im
    Stylesheet); links, weil die Hand oben rechts in jedem Winkel ihren Platz braucht.
    Blase unten links, die Hand dreht um ihre Mitte (36/24) und ragt oben rechts aus der Blase.
-->
<svg viewBox="3.5 -1 57.5 64.5" role="img" [attr.aria-label]="text">
    <defs *ngIf="glanz">
        <linearGradient [attr.id]="glanzId" x1="0" y1="0" x2="1" y2="1">
            <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".8"/>
            <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <g class="siegel-blase-gruppe" [attr.fill]="farbe" [attr.stroke]="rand" stroke-width="1.5" stroke-linejoin="round">
        <rect x="4" y="16" width="44" height="38" rx="11"/>
        <path d="M11 51 L8 63 L24 53 Z"/>
    </g>
    <g *ngIf="glanz" class="siegel-glanz">
        <g [attr.fill]="'url(#' + glanzId + ')'">
            <rect x="4" y="16" width="44" height="38" rx="11"/>
            <path d="M11 51 L8 63 L24 53 Z"/>
        </g>
    </g>
    <g class="siegel-hand" style="transform-origin: 36px 24px" [style.transform]="'rotate(' + winkel + 'deg)'">
        <g transform="translate(36 24) scale(1.6) translate(-16 -16)">
            <path [attr.d]="HAND" fill="none" [attr.stroke]="farbe" stroke-width="2.6" stroke-linejoin="round"/>
            <path [attr.d]="HAND" fill="#fff"/>
            <path [attr.d]="SCHATTEN" fill="rgb(0 0 0 / .22)"/>
        </g>
    </g>
    <!--
        Glanz-Sterne (Ersteindruck-Test 14.11.: „Glanz und Glitzer auffälliger“): ein grosser
        goldener Stern oben links, wo früher die Krone stand und die Hand in keinem Winkel
        hinkommt, dazu zwei kleine Funken links und unten rechts. Gold mit dunklem Rand,
        damit sie auf weissen und dunklen Karten stehen. Beim Erscheinen funkeln sie einmal
        auf; bei prefers-reduced-motion stehen sie still.
    -->
    <g *ngIf="glanz" class="siegel-sterne" fill="#ffd400" stroke="#6b5400" stroke-linejoin="round">
        <path class="siegel-stern" d="M9.0 -5.0 L10.8 2.2 L18.0 4.0 L10.8 5.8 L9.0 13.0 L7.2 5.8 L0.0 4.0 L7.2 2.2 Z" stroke-width="1.1"/>
        <path class="siegel-funkler" d="M-2.0 20.0 L-1.1 23.1 L2.0 24.0 L-1.1 24.9 L-2.0 28.0 L-2.9 24.9 L-6.0 24.0 L-2.9 23.1 Z" stroke-width="0.8"/>
        <path class="siegel-funkler" d="M60.0 45.5 L61.0 49.0 L64.5 50.0 L61.0 51.0 L60.0 54.5 L59.0 51.0 L55.5 50.0 L59.0 49.0 Z" stroke-width="0.8"/>
    </g>
</svg>
<span *ngFor="let f of funken" class="siegel-funke" aria-hidden="true"
      [style.--dx]="f.dx + '%'" [style.--dy]="f.dy + '%'"></span>
