<div class="mobile-header">
  <div class="mobile-header-left">
    <button
      *ngIf="showBackButton"
      mat-icon-button
      (click)="goBack()"
      class="back-button"
      aria-label="Zurück">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <!-- Ohne Pfeil steht hier das Logo als Link zur Startseite (#620); der Titel daneben nennt die Seite -->
    <a *ngIf="!showBackButton" class="home-spacer logo-link" href="/" aria-label="Startseite"
       data-testid="logo-startseite" (click)="startseite($event)">
      <img class="kopf-logo" src="marke/logo.svg" alt="" width="32" height="32">
    </a>
  </div>

  <!--
    Reiner Text, kein Link: Mobil steht hier der Name der Seite, auf der man ist
    ("Fangkorb"), nicht die Marke - ein Link darauf fuehrte woanders hin, als er
    verspricht. Zur Startseite fuehren das Logo links und der erste Menueeintrag.
  -->
  <!--
    Der Text sitzt in einem eigenen Element: Die Ellipse wirkt nur an einem
    Block, nicht am Flex-Container selbst.
  -->
  <!--
    Lange Titel ("Hier fehlt eine Antwort") werden kleiner und duerfen zweizeilig
    stehen, statt abgeschnitten zu werden (#512).
  -->
  <h2 class="mobile-header-title" [class.mobile-header-title--lang]="titelLang"><span class="mobile-header-title-text">{{ pageTitle }}</span></h2>

  <div class="mobile-header-actions">
    <!--
      Angemeldet: Avatar (oeffnet das Menue) und Beitragen. Anonym nur ein Text-Knopf
      "Anmelden": Ein grauer Avatar wirkte wie ein Konto, und "+" fuehrte doch nur zur
      Anmeldung (#644, wie am Desktop seit #599).
    -->
    <ng-container *ngIf="userInfo?.isAuthenticated; else anmeldenKnopf">
      <button type="button"
              class="mobile-header-avatar-container"
              (click)="openUserMenu()"
              aria-label="Profilmenü öffnen">
        <img [src]="selectedProfilePictureUrl"
             alt=""
             class="mobile-header-avatar">
      </button>

      <!-- Beitragen; "Meine Beitraege" steht im Menue. Den Neu-Punkt erklaert der Tooltip,
           fuer Screenreader als Beschreibung (#644) -->
      <button
        *ngIf="showContributeButton"
        mat-icon-button
        (click)="onContributeClick()"
        class="contribute-button"
        [matTooltip]="neuHinweis"
        [matTooltipDisabled]="!beitragenNeu"
        aria-label="Beitragen">
        <mat-icon>add</mat-icon>
        <span *ngIf="beitragenNeu" class="neu-punkt" aria-hidden="true"></span>
      </button>
    </ng-container>
    <ng-template #anmeldenKnopf>
      <!-- Auf der Anmeldeseite selbst nicht: Dort fuehrte der Knopf nur auf sich selbst -->
      <button *ngIf="!aufAnmeldung" mat-button type="button" class="anmelden-knopf" (click)="login.emit()">Anmelden</button>
    </ng-template>

    <button
      mat-icon-button
      (click)="openMobileMenu()"
      class="menu-button"
      aria-label="Menü öffnen">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</div>
