<!-- Nach dem Klick sofort laden; was ohne Klick sichtbar ist, darf warten -->
<img *ngIf="zeigen; else platzhalter" [src]="src" [alt]="alt"
     [attr.loading]="geladen ? 'eager' : 'lazy'" tabindex="-1" />

<ng-template #platzhalter>
    <button type="button" class="bild-laden"
            [attr.aria-label]="alt ? 'Bild laden: ' + alt : 'Bild laden'"
            [attr.title]="'Lädt das Bild von ' + server"
            (click)="laden($event)">
        <span *ngIf="mitSymbol" class="bild-laden-symbol" aria-hidden="true">🖼️</span>
        <span>Bild laden</span>
    </button>
</ng-template>
