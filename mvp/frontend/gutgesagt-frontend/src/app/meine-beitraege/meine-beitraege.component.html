<div class="component-box">
    <!-- Tab-Muster nach WAI-ARIA: ein Tab-Stopp, Pfeiltasten wechseln den Tab -->
    <div class="tabs" role="tablist" aria-label="Meine Beiträge und Einwürfe" (keydown)="tabTaste($event)">
        <button *ngFor="let eintrag of tabs" type="button" role="tab" class="tab"
                [id]="'meine-tab-' + eintrag.wert"
                [attr.aria-controls]="'meine-bereich-' + eintrag.wert"
                [class.aktiv]="tab === eintrag.wert"
                [attr.aria-selected]="tab === eintrag.wert"
                [attr.tabindex]="tab === eintrag.wert ? 0 : -1"
                (click)="tabWaehlen(eintrag.wert)">{{ eintrag.name }}</button>
    </div>

    <div id="meine-bereich-beitraege" role="tabpanel" aria-labelledby="meine-tab-beitraege"
         [hidden]="tab !== 'beitraege'">
        <!-- Gesperrte eigene Beitraege stehen nicht im Album, nur hier (#448) -->
        <app-sperrnachrichten></app-sperrnachrichten>

        <!-- Nur fuer die Person selbst; bei ausgeschalteten Punkten leer (#352) -->
        <app-punkte></app-punkte>

        <!-- Nur fuer die Person selbst; ohne Meilensteine (Punkte aus, keine Einwilligung) leer (#351) -->
        <app-meilensteine></app-meilensteine>

        <div *ngIf="isLoading">
            <p>Lade eigene Beiträge …</p>
            <div class="loading-container">
                <mat-spinner class="mat-spinner-color"></mat-spinner>
            </div>
        </div>

        <div *ngIf="!isLoading">
            <ng-container *ngIf="!karten.length">
                <p class="beitraege-leer">Du hast noch keine Beiträge.</p>
                <!-- Ein konkreter erster Schritt statt nur "Beitragen" (#645) -->
                <section *ngIf="unbeantworteteAussagen.length" class="erster-schritt" aria-labelledby="erster-schritt-titel">
                    <h2 id="erster-schritt-titel">Fang mit einer unbeantworteten Aussage an</h2>
                    <ul class="unbeantwortete-aussagen">
                        <li *ngFor="let aussage of unbeantworteteAussagen" class="unbeantwortete-aussage" data-testid="unbeantwortete-aussage">
                            <p class="unbeantwortete-aussage-text" [id]="'unbeantwortet-' + aussage.statement_id">{{ aussage.statement_text }}</p>
                            <a mat-stroked-button class="antworten"
                               [routerLink]="kommentarFormular"
                               [queryParams]="beantwortenParams(aussage)"
                               [attr.aria-describedby]="'unbeantwortet-' + aussage.statement_id">Antworten</a>
                        </li>
                    </ul>
                    <a class="alle-unbeantworteten" [routerLink]="hierFehltEineAntwortPfad">Alle in „Hier fehlt eine Antwort“</a>
                </section>
                <button mat-raised-button type="button" class="dark-green-button beitraege-leer-knopf"
                        (click)="zumBeitragen()">Beitragen</button>
            </ng-container>

            <p *ngIf="karten.length" class="album-statistik">{{ statistik }}</p>

            <app-kartenliste *ngIf="karten.length"
                             variante="kompakt"
                             [daten]="karten"
                             (angetippt)="beitragOeffnen($event)">
            </app-kartenliste>
        </div>

        <!-- Ausserhalb des Ladezweigs: sonst entsteht der Paginator bei jedem Seitenwechsel neu und steht wieder auf Seite 1 -->
        <mat-paginator *ngIf="totalRecords > SEITENGROESSE" [length]="totalRecords"
            [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[24, 48, 96]" [hidePageSize]="istMobil"
            (page)="onPageChange($event)">
        </mat-paginator>
    </div>

    <!-- Erst beim ersten Oeffnen geladen, danach nur versteckt: Seite und Liste bleiben beim Wechseln stehen -->
    <div id="meine-bereich-einwuerfe" role="tabpanel" aria-labelledby="meine-tab-einwuerfe"
         [hidden]="tab !== 'einwuerfe'">
        <app-meine-einwuerfe *ngIf="einwuerfeGeoeffnet"></app-meine-einwuerfe>
    </div>
</div>
