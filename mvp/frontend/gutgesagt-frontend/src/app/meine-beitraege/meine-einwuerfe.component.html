<div *ngIf="isLoading" class="einwuerfe-laedt">
    <p>Lade eigene Einwürfe …</p>
    <mat-spinner class="mat-spinner-color" diameter="40"></mat-spinner>
</div>

<!-- Live-Region, immer im DOM: sagt den ersten Ladefehler und die Rueckkehr an -->
<div class="visually-hidden" role="status">{{ ansage }}</div>

<!-- Nie "neu laden": Die Liste versucht es selbst wieder, der Knopf zieht den Versuch vor -->
<div *ngIf="!isLoading && ladefehler" class="einwuerfe-fehler">
    <p>
        Deine Einwürfe konnten gerade nicht geladen werden.
        <ng-container *ngIf="erneutLaedt">Neuer Versuch läuft …</ng-container>
        <ng-container *ngIf="!erneutLaedt && versuchtWeiter">Die Seite versucht es weiter.</ng-container>
    </p>
    <button mat-stroked-button type="button" class="erneut-versuchen"
            [attr.aria-disabled]="erneutLaedt" (click)="erneutVersuchen()">Erneut versuchen</button>
</div>

<!-- Ziel des Fokus nach einem Ladefehler (tabindex -1) -->
<div *ngIf="!isLoading && !ladefehler" class="einwuerfe-inhalt" tabindex="-1">
    <p *ngIf="!karten.length" class="einwuerfe-leer">Du hast noch nichts eingeworfen.</p>

    <p *ngIf="karten.length" class="einwuerfe-statistik">{{ statistik }}</p>

    <ul *ngIf="karten.length" class="karten">
        <li *ngFor="let karte of karten; trackBy: nachKarte">
            <app-beitragskarte variante="einwurf" [daten]="karte" [stufeZeigen]="true"
                               (aktion)="aktionAusfuehren(karte, $event)">
            </app-beitragskarte>
        </li>
    </ul>
</div>

<!-- Ausserhalb des Ladezweigs: sonst entsteht der Paginator bei jedem Seitenwechsel neu und steht wieder auf Seite 1 -->
<mat-paginator *ngIf="gesamt > SEITENGROESSE" [length]="gesamt"
    [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[24, 48, 96]" [hidePageSize]="istMobil"
    (page)="onPageChange($event)">
</mat-paginator>
