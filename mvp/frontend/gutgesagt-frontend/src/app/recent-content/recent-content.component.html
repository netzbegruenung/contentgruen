<!-- Recent Content Header -->
<div class="recent-content-header">
  <h2>Frisch aus der Community: Neueste Inhalte</h2>

  <!-- Loading Spinner -->
  <app-loading-spinner
    [loading]="loading"
    message="Lade neueste Inhalte...">
  </app-loading-spinner>

  <!-- Error Message -->
  <app-error-message
    [error]="error"
    [showRetry]="true"
    [retryAction]="retryLoad">
  </app-error-message>

  <!-- Empty State -->
  <div *ngIf="!loading && !error && karten.length === 0" class="empty-state">
    <p>Keine neuen Inhalte verfügbar.</p>
  </div>
</div>

<!-- Mobil eine Liste, ab 600 px das Karussell -->
<ng-container *ngIf="!loading && !error && karten.length > 0">
  <app-kartenliste *ngIf="istMobil; else karussell" [daten]="karten"></app-kartenliste>
  <ng-template #karussell>
    <app-result-carousel [daten]="karten"></app-result-carousel>
  </ng-template>
</ng-container>
