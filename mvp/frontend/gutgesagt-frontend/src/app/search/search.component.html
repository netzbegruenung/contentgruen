<div class="search-container" [class.compact-mode]="compactMode">
    <form (ngSubmit)="onSearch()" class="search-form" [class.search-form-compact]="compactMode">
        <mat-form-field appearance="outline" class="search-field">
            <!-- Ohne Pflichtstern: Auf einer Seite mit nur einem Feld war er Formularsprache (#644) -->
            <mat-label>
                <span class="label">{{ feldName }}</span>
            </mat-label>
            <input matInput #feld [id]="feldId" [(ngModel)]="searchQuery" name="searchQuery">
            <!-- Search button as suffix icon on mobile in compact mode -->
            <button mat-icon-button matSuffix type="submit" class="mobile-search-button"
                    *ngIf="compactMode"
                    [disabled]="!searchQuery || !searchQuery.trim()">
                <mat-icon>search</mat-icon>
            </button>
        </mat-form-field>
        <!-- Search button: below input on main page, inline on results page desktop -->
        <div class="search-button-container" [class.desktop-inline]="compactMode" [class.desktop-only]="compactMode">
            <button mat-raised-button class="gutgesagt-primary-dark search-button" type="submit">
                <mat-icon>search</mat-icon> Suchen
            </button>
        </div>
    </form>
</div>
