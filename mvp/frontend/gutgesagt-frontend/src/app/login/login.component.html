<div class="component-box">
    <div class="login-box">
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
            <mat-form-field class="full-width" appearance="outline">
                <mat-label>E-Mail-Adresse</mat-label>
                <input matInput type="email" formControlName="email"
                       autocomplete="email" aria-label="E-Mail-Adresse" />
                <mat-error *ngIf="loginForm.get('email')?.invalid">
                    {{ getErrorMessage('email') }}
                </mat-error>
            </mat-form-field>

            <mat-form-field class="full-width" appearance="outline">
                <mat-label>Passwort</mat-label>
                <input matInput type="password" formControlName="password"
                       autocomplete="current-password" aria-label="Passwort"
                       [aria-describedby]="errorMessage ? 'anmeldefehler' : ''" />
                <mat-error *ngIf="loginForm.get('password')?.invalid && getErrorMessage('password')">
                    {{ getErrorMessage('password') }}
                </mat-error>
            </mat-form-field>

            <!-- Die eine Meldung zu falschen Zugangsdaten, direkt am Feld; keine Snackbar dazu (#645) -->
            <p *ngIf="errorMessage" id="anmeldefehler" class="anmeldefehler" role="alert">
                {{ errorMessage }}
            </p>

            <div class="button-container">
                <button mat-raised-button class="dark-green-button" type="submit"
                        [disabled]="isLoading" aria-label="Anmelden">
                    <mat-spinner *ngIf="isLoading" diameter="20" class="button-spinner"></mat-spinner>
                    <span *ngIf="!isLoading">Anmelden</span>
                </button>
            </div>

            <p class="passwort-vergessen">
                Passwort vergessen? Schreib an
                <a [href]="passwortVergessenLink">{{ gutgesagtMail }}</a>.
            </p>
        </form>
    </div>
</div>
