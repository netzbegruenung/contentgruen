<div class="component-box footer-container">
    <!-- Zwei Zeilen: oben die Links, darunter der Traeger; keine Trennstriche,
         die beim Umbruch am Zeilenende haengen bleiben (#512). -->
    <div class="footer">
        <nav class="footer-links" aria-label="Fußzeile">
            <button type="button" (click)="openHelpDialog()" class="help-button">Hilfe</button>
            <a routerLink="/about" class="about-link">Über Gut gesagt</a>
            <a routerLink="/impressum" class="legal-link">Impressum</a>
            <a routerLink="/datenschutz" class="legal-link">Datenschutz</a>
            <a routerLink="/nutzungsbedingungen" class="legal-link">Nutzungsbedingungen</a>
        </nav>
        <span class="traeger">Ein Projekt von
            <a target="_blank" rel="noopener" href="https://netzbegruenung.de/" class="anbieter-link">Netzbegrünung e.V.</a>,
            entwickelt von
            <a routerLink="/about" class="creator-link">Sebastian Banach</a>
        </span>
    </div>
    <div class="build-kennung">{{ buildKennung }}</div>
</div>
