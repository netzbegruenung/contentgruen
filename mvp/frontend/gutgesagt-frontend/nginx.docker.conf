# Zugriffsprotokoll ohne Suchtext (#275). Das Standardformat schreibt die volle
# Adresse samt Adresszusatz und die verweisende Seite; beide tragen den Suchtext,
# sobald jemand /result?searchQuery=... aufruft oder diese Seite etwas nachlaedt.
# $pfad ist der aufgerufene Pfad ohne Adresszusatz ($uri waere nach try_files
# schon /index.html). Steht hier, weil conf.d/*.conf im http-Block eingebunden
# wird; access_log im server-Block ersetzt das Standardformat.
map $request_uri $pfad {
    "~^(?<ohne_zusatz>[^?]*)" $ohne_zusatz;
}
log_format ohne_suchtext '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $pfad $server_protocol" $status '
                         '$body_bytes_sent "$http_user_agent"';

# Keine Zeile je Suche: Ihre genaue Uhrzeit liesse sich, je Tag durchgezaehlt,
# mit dem Anlagezeitpunkt der Aussage verbinden, die dieselbe Suche anlegt.
map $pfad $zugriff_protokollieren {
    /api/v1/search/searchByText 0;
    default                     1;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log ohne_suchtext if=$zugriff_protokollieren;

    # Serve the Angular application
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the BFF service
    location /api/ {
        proxy_pass http://gutgesagt-bff:5054/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy login/logout endpoints to BFF
    location /login {
        proxy_pass http://gutgesagt-bff:5054/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://gutgesagt-bff:5054/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes - all other routes should serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Der Service Worker darf nicht in die *.js-Regel unten fallen: mit
    # "expires 1y" haenge ein Geraet ein Jahr an der ausgelieferten Fassung.
    # Browser deckeln die Lebensdauer von Worker-Skripten zwar selbst, aber
    # darauf soll sich hier nichts verlassen muessen. Exaktes Praefix "=",
    # damit diese Regel die Regex-Regel schlaegt.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # nginx' mime.types kennt .webmanifest je nach Version nicht und liefert dann
    # application/octet-stream aus. Der Typ wird deshalb hier festgelegt.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Static file caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
        add_header Pragma "public";
        add_header Vary "Accept-Encoding";
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
