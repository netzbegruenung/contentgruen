# Formate und Ausnahmen des Zugriffsprotokolls: nginx.protokoll.conf (#275).
server {
    listen 80;
    server_name _;  # Wildcard to match any hostname
    access_log /var/log/nginx/access.log ohne_suchtext if=$zugriff_protokollieren;

    # Serve the index.html file for all requests
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Der Service Worker gar nicht im Cache: Ein Geraet soll nie an einer alten
    # Fassung haengen. Browser deckeln die Lebensdauer von Worker-Skripten zwar
    # selbst, aber darauf soll sich hier nichts verlassen muessen. Exaktes
    # Praefix "=", damit diese Regel die Regex-Regeln unten schlaegt.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # security.txt (RFC 9116, #430): als text/plain mit UTF-8 und nicht ein Jahr im Cache,
    # sonst sieht niemand ein erneuertes Expires. Erneuern: SECURITY.md, "Renewing security.txt".
    location = /.well-known/security.txt {
        default_type text/plain;
        types { }
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # nginx' mime.types kennt .webmanifest je nach Version nicht und liefert dann
    # application/octet-stream aus. Der Typ wird deshalb hier festgelegt.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Nur Dateien mit Inhalts-Hash im Namen liegen ein Jahr im Cache: die Ausgabe von
    # "ng build" mit outputHashing "all" (main-XJITCGMB.js, chunk-3642N7JF.js,
    # styles-4INU76GJ.css, media/<name>-<HASH>.<endung>). Ein neuer Inhalt bekommt dort einen
    # neuen Namen, "immutable" spart auch die Rueckfrage beim Neuladen. Gross-/Kleinschreibung
    # zaehlt ("~", nicht "~*"): Der Hash besteht aus acht Grossbuchstaben und Ziffern. Diese
    # Regel muss vor der allgemeinen stehen, nginx nimmt die erste passende Regex.
    location ~ "^/(?:[^/]+-[A-Z0-9]{8}\.(?:js|css)|media/[^/]+-[A-Z0-9]{8}\.[a-z0-9]+)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Alle uebrigen statischen Dateien kommen ungehasht aus public/ (Profilbilder, Avatare,
    # Symbole, Schriften) und behalten beim Ersetzen ihren Namen. Mit "expires 1y" sahen
    # Browser nach #725 ein Jahr lang das alte /profilbild-2026.jpg. "no-cache" heisst: im
    # Cache behalten, vor jeder Nutzung per ETag/Last-Modified nachfragen; unveraendert
    # kostet das eine 304 ohne Rumpf.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|otf|svg)$ {
        add_header Cache-Control "no-cache";
        add_header Vary "Accept-Encoding";
    }

    # Optional: Disable cache for index.html (ensure up-to-date content)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}
