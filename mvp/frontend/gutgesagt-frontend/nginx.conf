# Formate und Ausnahmen des Zugriffsprotokolls: nginx.protokoll.conf (#275).
server {
    listen 80;
    server_name _;  # Wildcard to match any hostname
    access_log /var/log/nginx/access.log ohne_suchtext if=$zugriff_protokollieren;

    # Serve the index.html file for all requests
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Der Service Worker gar nicht im Cache: Ein Geraet soll nie an einer alten
    # Fassung haengen. Browser deckeln die Lebensdauer von Worker-Skripten zwar
    # selbst, aber darauf soll sich hier nichts verlassen muessen. Exaktes
    # Praefix "=", damit diese Regel die Regex-Regeln unten schlaegt.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # security.txt (RFC 9116, #430): als text/plain mit UTF-8 und nicht ein Jahr im Cache,
    # sonst sieht niemand ein erneuertes Expires. Erneuern: SECURITY.md, "Renewing security.txt".
    location = /.well-known/security.txt {
        default_type text/plain;
        types { }
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # nginx' mime.types kennt .webmanifest je nach Version nicht und liefert dann
    # application/octet-stream aus. Der Typ wird deshalb hier festgelegt.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Nur Dateien mit Inhalts-Hash im Namen liegen ein Jahr im Cache: die Ausgabe von
    # "ng build" mit outputHashing "all" (main-XJITCGMB.js, chunk-3642N7JF.js,
    # styles-4INU76GJ.css, media/<name>-<HASH>.<endung>). Ein neuer Inhalt bekommt dort einen
    # neuen Namen, "immutable" spart auch die Rueckfrage beim Neuladen. Gross-/Kleinschreibung
    # zaehlt ("~", nicht "~*"): Der Hash besteht aus acht Grossbuchstaben und Ziffern. Diese
    # Regel muss vor der allgemeinen stehen, nginx nimmt die erste passende Regex.
    location ~ "^/(?:[^/]+-[A-Z0-9]{8}\.(?:js|css)|media/[^/]+-[A-Z0-9]{8}\.[a-z0-9]+)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Alle uebrigen statischen Dateien kommen ungehasht aus public/ (Profilbilder, Avatare,
    # Symbole, Schriften) und behalten beim Ersetzen ihren Namen. Mit "expires 1y" sahen
    # Browser nach #725 ein Jahr lang das alte /profilbild-2026.jpg. Jetzt einen Tag ohne
    # Rueckfrage, danach fragt der Browser per ETag/Last-Modified nach (unveraendert: 304
    # ohne Rumpf). Ein getauschtes Bild ist so hoechstens einen Tag alt (20.11.2026).
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|otf|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Vary "Accept-Encoding";
    }

    # Linkvorschau je Beitrag und fuer die Ergebnisseite (#360). Crawler von Messengern
    # fuehren kein JavaScript aus; sie sehen nur index.html. Fuer diese beiden Adressen
    # wertet nginx darin die SSI-Anweisungen aus und setzt og:title und og:description
    # aus dem Suchdienst ein (api/v1/linkvorschau.py), fuer alle Clients gleich. Kommt
    # nichts (gesperrt, geloescht, unbekannt, Fehler, Frist abgelaufen), gilt der Block
    # "linkvorschau_allgemein" aus index.html; die Seite laedt in jedem Fall normal.
    # try_files ohne Umleitung, damit ssi in dieser location gilt; Cache wie index.html.
    location ~ "^/beitrag/([0-9a-fA-F-]{36})/?$" {
        set $linkvorschau /_linkvorschau/beitrag/$1;
        ssi on;
        ssi_silent_errors on;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Der Suchtext geht als Adresszusatz nur in die interne Anfrage (sie steht in keinem
    # Protokoll: log_subrequest ist aus) und von dort im Header X-Suchtext zum Suchdienst.
    location = /result {
        set $linkvorschau /_linkvorschau/ergebnis?$args;
        ssi on;
        ssi_silent_errors on;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Nur fuer die SSI-Anweisung oben. Direkt an den Suchdienst im internen Netz, ohne
    # Header und Cookies der Anfrage; "?" am Ende der Umschreibung laesst den
    # Adresszusatz weg. Der Name wird zur Laufzeit ueber das DNS von Docker aufgeloest,
    # damit nginx auch startet, wenn der Suchdienst (noch) fehlt. Knappe Fristen: Ein
    # Crawler wartet nicht lange, und ohne Antwort gilt die allgemeine Vorschau.
    location /_linkvorschau/ {
        internal;
        set $linkvorschau_suchtext $arg_searchQuery;
        set $linkvorschau_dienst gutgesagt-semantic-search:8000;
        rewrite ^/_linkvorschau/(.*)$ /api/v1/linkvorschau/$1? break;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 1s;
        proxy_pass http://$linkvorschau_dienst;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header X-Suchtext $linkvorschau_suchtext;
        proxy_connect_timeout 1s;
        proxy_send_timeout 1s;
        proxy_read_timeout 1s;
        # Durch kommt nur eine Antwort mit Status 200 (oder 204, ohne Rumpf). Jeder andere
        # Status, den nginx kennt, faellt auf den Block zurueck, damit nie der Rumpf einer
        # Fehlerseite oder Umleitung im <head> landet.
        proxy_intercept_errors on;
        error_page 300 301 302 303 304 305 307 308
                   400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417
                   421 422 423 424 425 426 428 429 431 451
                   500 501 502 503 504 505 506 507 508 510 511 = @linkvorschau_leer;
    }

    # Leer heisst fuer SSI: der Block "linkvorschau_allgemein" gilt.
    location @linkvorschau_leer {
        return 204;
    }

    # Optional: Disable cache for index.html (ensure up-to-date content)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}
