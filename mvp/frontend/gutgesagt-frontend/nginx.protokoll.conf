# Protokolle ohne Suchtext und ohne Zeile je Suche (#275), fuer nginx.conf und
# nginx.docker.conf gemeinsam. Das Dockerfile legt die Datei als
# conf.d/00-protokoll.conf ab: conf.d/*.conf wird im http-Block in alphabetischer
# Reihenfolge eingebunden, und log_format muss vor dem access_log stehen, das es
# benutzt (im server-Block der jeweiligen default.conf).
#
# Das Standardformat schreibt die volle Adresse samt Adresszusatz und die
# verweisende Seite; beide tragen den Suchtext, sobald jemand
# /result?searchQuery=... aufruft oder diese Seite etwas nachlaedt.
# $pfad ist der aufgerufene Pfad ohne Adresszusatz ($uri waere nach try_files
# schon /index.html).
map $request_uri $pfad {
    "~^(?<ohne_zusatz>[^?]*)" $ohne_zusatz;
}
log_format ohne_suchtext '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $pfad $server_protocol" $status '
                         '$body_bytes_sent "$http_user_agent"';

# Keine Zeile je Suche: Ihre genaue Uhrzeit liesse sich, je Tag durchgezaehlt,
# mit dem Anlagezeitpunkt der Aussage verbinden, die dieselbe Suche anlegt. Das
# gilt fuer die Suche selbst (nur im Dev-Stack laeuft sie ueber dieses nginx) und
# fuer jeden direkten Aufruf der Ergebnisseite, der eine Suche ausloest.
map $pfad $zugriff_protokollieren {
    "~*^/api/v1/search/searchByText" 0;
    "~*^/result(/|$)"                0;
    default                          1;
}

# Eine fehlende Datei schriebe sonst eine Zeile ins Fehlerprotokoll, mit Adresse
# samt Adresszusatz und verweisender Seite.
log_not_found off;
