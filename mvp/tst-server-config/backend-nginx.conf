server {
    # Forwarding HTTP to HTTPS

    server_name bff.test.contentgruen.de;
    listen 80;
    listen [::]:80;

    if ($host = bff.test.contentgruen.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    # Challenge route for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    # HTTPS Server Config

    server_name bff.test.contentgruen.de;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/bff.test.contentgruen.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bff.test.contentgruen.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # All routes to Backend
    location / {
        proxy_pass http://127.0.0.1:3001;  # BFF Docker Container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/;  HttpOnly; Secure; SameSite=Lax;";

        proxy_redirect off;

        # Increase buffer sizes for keycloak
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Challenge route for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
