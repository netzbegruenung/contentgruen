name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'renovate.json'
      - 'README.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.verdigado.com
  REGISTRY_NAMESPACE: netzbegruenung-images

jobs:
  # Detects which image source paths have changed so we only build what's necessary.
  # On workflow_dispatch (no diff available) all outputs default to 'true' → all 5 build.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      bff: ${{ steps.filter.outputs.bff }}
      semantic: ${{ steps.filter.outputs.semantic }}
      postgres_app: ${{ steps.filter.outputs.postgres_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'mvp/frontend/**'
            bff:
              - 'mvp/backend/BFF/**'
            semantic:
              - 'mvp/backend/semantic-search-service/**'
            postgres_app:
              - 'mvp/backend/postgres-app/**'

  # Test suites live in reusable workflows so release.yml runs the identical suite.
  test:
    uses: ./.github/workflows/tests-backend.yml

  test-frontend:
    uses: ./.github/workflows/tests-frontend.yml

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [changes, test, test-frontend]
    # Build only when frontend paths changed (or manual trigger); never push from PRs
    if: |
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Verdigado registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VERDIGADO_REGISTRY_USER }}
          password: ${{ secrets.VERDIGADO_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/contentgruen-frontend
          tags: |
            # :main — moves with every push; watched by the tst deployment
            type=raw,value=main
            # :sha-abc1234 — immutable short SHA; for rollback and traceability
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mvp/frontend/contentgruen-frontend
          file: mvp/frontend/contentgruen-frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-bff:
    name: Build BFF Image
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: |
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.bff == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Verdigado registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VERDIGADO_REGISTRY_USER }}
          password: ${{ secrets.VERDIGADO_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/contentgruen-bff
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mvp/backend/BFF
          file: mvp/backend/BFF/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-semantic-search:
    name: Build Semantic Search Image
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: |
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.semantic == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Verdigado registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VERDIGADO_REGISTRY_USER }}
          password: ${{ secrets.VERDIGADO_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/contentgruen-semantic-search
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Context must be mvp/ (not the service dir) — the Dockerfile COPYs from
          # backend/semantic-search-service/, scripts/backup/, and data/, all relative to mvp/
          context: mvp
          file: mvp/backend/semantic-search-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-postgres-app:
    name: Build Postgres App Image
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: |
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.postgres_app == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Verdigado registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VERDIGADO_REGISTRY_USER }}
          password: ${{ secrets.VERDIGADO_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/contentgruen-postgres-app
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mvp/backend/postgres-app
          file: mvp/backend/postgres-app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
